{% load static%}
<!doctype html>
<html lang="pt-br">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1"> -->

  <!--CSS -->
  <link href="{% static 'css/forms.css' %}" rel="stylesheet">

  <title>ForCast</title>
</head>

<body>
  <h1>ForCast</h1>
  <form id="formulario" enctype="multipart/form-data" method="post" action="http://127.0.0.1:8000/">
    {% csrf_token %}
    <div class="text_form">
      <label>Nome:
        <input type="text" id="nome-form" name="nome"></label>
    </div>

    <div class="endereco_form">
      <label>Endereço:
        <input type="text" id="endereco-form" name="endereco"></label>
    </div>

    <div class="idade_form">
      <label>Idade:
        <input type="number" id="idade-form" name="idade"></label>
    </div>

    <div class="dtnascimento_form">
      <label>Idade:
        <input type="date" id="dtnascimento-form" name="dt_nascimento"></label>
    </div>

    <div class="raca_form">
      <legend>Raça:</legend>

      <label><input type="radio" name="raca" value="preto">
        Preto</label>

      <label> <input type="radio" name="raca" value="amarelo">
        Amarelo</label>

      <label><input type="radio" name="raca" value="branco">
        Branco</label>

      <label><input type="radio" name="raca" value="pardo">
        Pardo</label>
    </div>

    <div class="formacao_form">
      <legend>Formação:</legend>

      <label><input type="checkbox" name="formacao" value="medio_incompleto">
        Ensino Médio Incompleto</label>

      <label> <input type="checkbox" name="formacao" value="medio_completo">
        Ensino Médio Completo</label>

      <label><input type="checkbox" name="formacao" value="superior_incompleto">
        Superior Incompleto</label>

      <label><input type="checkbox" name="formacao" value="superior_completo">
        Superior Completo</label>

      <label><input type="checkbox" name="formacao" value="curso_tecnico">
        Curso Técnico</label>

      <label><input type="checkbox" name="formacao" value="pos_graduacao">
        Pós Gradução</label>

      <div class="arquivo_form">
        <label>Seleciona um arquivo:</label>
        <input type="file" id="arquivo-form" name="arquivo">
      </div>
    </div>
    <div>
      <button type="submit" class="btn_enviar">Enviar</button>
    </div>
  </form>
</body>

</html>
